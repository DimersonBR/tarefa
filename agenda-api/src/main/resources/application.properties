spring.application.name=agenda-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agenda}
spring.datasource.username=${DB_USER:agenda}
spring.datasource.password=${DB_PASSWORD:agenda_local}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.mvc.problemdetails.enabled=true
server.port=${PORT:8080}
